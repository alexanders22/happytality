# Deploy Happytality to Hostinger VPS on push.
# NeuroKali used manual rsync; this is the git-push equivalent.
#
# GitHub Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  — private key; public key on root@VPS ~/.ssh/authorized_keys
#   DEPLOY_HOST     — optional, default 148.230.71.98
#   DEPLOY_USER     — optional, default root

name: Deploy Hostinger VPS

on:
  push:
    branches:
      - codex/mvp-foundation
      - main
  workflow_dispatch:

concurrency:
  group: deploy-happytality
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Known hosts
        run: |
          HOST="${{ secrets.DEPLOY_HOST }}"
          HOST="${HOST:-148.230.71.98}"
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          echo "HOST=$HOST" >> "$GITHUB_ENV"

      - name: Rsync
        run: |
          USER="${{ secrets.DEPLOY_USER }}"
          USER="${USER:-root}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/vendor' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/.env' \
            --exclude 'frontend/.env' \
            --exclude 'frontend/.env.*' \
            ./ "${USER}@${HOST}:/var/www/happytality/"

      - name: Remote build
        run: |
          USER="${{ secrets.DEPLOY_USER }}"
          USER="${USER:-root}"
          ssh "${USER}@${HOST}" 'cd /var/www/happytality && bash deploy/remote-build.sh'
