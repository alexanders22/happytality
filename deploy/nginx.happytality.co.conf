# Happytality — nginx (HTTP first; Certbot adds SSL after DNS)
# Vite SPA at /  ·  Laravel at /api/*

server {
    listen 80;
    server_name happytality.co www.happytality.co;

    access_log /var/log/nginx/happytality.co-access.log;
    error_log  /var/log/nginx/happytality.co-error.log;

    root /var/www/happytality/frontend/dist;
    index index.html;

    client_max_body_size 32M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Laravel API (routes under /api/v1/...)
    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/happytality/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/happytality/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Laravel storage / public assets if needed later
    location ^~ /storage {
        alias /var/www/happytality/backend/storage/app/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

