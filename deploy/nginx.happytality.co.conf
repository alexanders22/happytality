# Happytality — SPA + Laravel API (HTTP → HTTPS)
# Vite SPA at /  ·  Laravel at /api/*

server {
    listen 80;
    server_name happytality.co www.happytality.co;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name happytality.co www.happytality.co;

    ssl_certificate     /etc/letsencrypt/live/happytality.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/happytality.co/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/happytality.co-access.log;
    error_log  /var/log/nginx/happytality.co-error.log;

    root /var/www/happytality/frontend/dist;
    index index.html;

    client_max_body_size 32M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
        access_log off;
    }


    location ^~ /api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/happytality/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/happytality/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_read_timeout 60s;
    }

    location ^~ /storage {
        alias /var/www/happytality/backend/storage/app/public;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
